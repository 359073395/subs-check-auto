name: 云端采集候选（不覆盖本地订阅）

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-candidates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 安装依赖并检查发布保护
        run: |
          python3 -m pip install --quiet 'PyYAML>=6,<7'
          python3 -m unittest discover -s tests -v
      - name: 下载固定版本检测程序
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download v3.6.1 --repo sinspired/subs-check-pro --pattern "subs-check-pro_Linux_x86_64.tar.gz"
          tar -xzf subs-check-pro_Linux_x86_64.tar.gz
          chmod +x subs-check-pro
      - name: 生成云端候选
        run: bash ./scripts/run_in_ci.sh
      - name: 保存候选与检测日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-candidates
          path: |
            output/cloud-candidates/
            output/runs/
          retention-days: 3
