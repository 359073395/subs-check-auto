# subs-check-pro 自动化配置（GitHub Actions 无服务器云端版）
# 上游项目: https://github.com/sinspired/subs-check-pro

# -----------进度显示-----------
print-progress: false
progress-mode: 'auto'

# -----------计划任务-----------
# 留空使程序启动后立即执行一轮检测，完成后通过回调脚本退出
cron-expression: ''
check-interval: 360

# -----------检测参数-----------
# 0 表示由程序自动计算最优并发数
alive-concurrent: 0
speed-concurrent: 0
media-concurrent: 0
concurrent: 120
ipv6: false

nameserver:
  - 1.1.1.1
  - 8.8.8.8
  - 223.5.5.5

timeout: 4000

# 收集足够多的合格加密节点，再由精选脚本剔除易被 SNI 阻断的免费域名后保留 Top 100
success-limit: 800

use-last-result: false
use-history-result: false

# -----------测速参数-----------
# 最低速度门槛 256 KB/s，过滤掉过慢的节点
min-speed: 256
download-timeout: 6
download-mb: 15
total-speed-limit: 0
# 使用内置多区域高速 CDN 随机测速地址
speed-test-url: 'random'

threshold: 0.75
gc-threshold: 20000

# -----------版本更新-----------
# CI 环境下每次都会拉取最新 Release，关闭自更新避免中断进程
update: false
update-on-startup: false
prerelease: false

# -----------WebUI 与 Sub-Store-----------
listen-port: ':8199'
enable-web-ui: false
api-key: 'ci-local-runner'
share-password: ''

sub-store-port: ':8299'
sub-store-path: '/substore'
sub-store-update-notify: false
mihomo-overwrite-url: 'http://127.0.0.1:8199/Mihomo-Rules-CDN.yaml'

# -----------节点处理-----------
rename-node: true
node-prefix: ''
# 仅保留抗封锁较强的加密协议（剔除 http / socks5 / 明文 ss）
node-type:
  - vless
  - trojan
  - hysteria2
  - hy2
  - vmess
drop-bad-cf-nodes: true
enhanced-tag: true

# -----------流媒体与纯净度检测（默认配置 + IP 纯净度）-----------
media-check: true
media-check-timeout: 6
platforms:
  - iprisk
  - youtube
  - x

# -----------存储与回调-----------
output-dir: './output'
save-method: 'local'
callback-script: './scripts/on_check_done.sh'

# -----------通知设置（已关闭）-----------
recipient-url: []

# -----------订阅拉取参数-----------
sub-urls-retry: 3
sub-urls-timeout: 12
sub-url-max-size-mb: 50
net-guard: false
success-rate: 0

# -----------公益节点订阅源（聚焦中文社区高质量/CDN 节点池，剔除易被墙的扫描裸 IP 池）-----------
sub-urls-remote:
  - 'https://raw.githubusercontent.com/sinspired/airport/main/subs/merged/col.txt'
  - 'https://raw.githubusercontent.com/sinspired/airport/main/subs/merged/cm.txt'

