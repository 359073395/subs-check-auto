# subs-check-pro Windows 本地真实网络检测配置
# 从本机网络采集初筛；发布前还须独立内核复测，结果不保证持续有效

# -----------进度显示-----------
print-progress: false
progress-mode: 'auto'

# -----------计划任务-----------
cron-expression: ''
check-interval: 360

# -----------检测参数（适配家用宽带，避免路由器连接数打满）-----------
alive-concurrent: 10
speed-concurrent: 2
media-concurrent: 10
concurrent: 48
ipv6: false

nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 8.8.8.8

proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - 223.5.5.5

timeout: 10000

# 收集最多 40 个可连接候选，发布前用独立内核复测真实 HTTPS 请求
success-limit: 40

use-last-result: false
use-history-result: false

# -----------下载测速（本地默认关闭，不以下载带宽淘汰可用节点）-----------
# 随机下载站失败或限速不等于节点不可用；最终按 HTTPS 复测与延迟筛选
min-speed: 0
download-timeout: 6
download-mb: 10
total-speed-limit: 0
speed-test-url: ''

threshold: 0.75
gc-threshold: 20000

# -----------版本更新-----------
update: false
update-on-startup: false
prerelease: false

# -----------WebUI 与 Sub-Store-----------
listen-port: ':18199'
enable-web-ui: false
api-key: 'local-runner'
share-password: ''

sub-store-port: ':18299'
sub-store-path: '/substore'
sub-store-update-notify: false
mihomo-overwrite-url: 'http://127.0.0.1:18199/Mihomo-Rules-CDN.yaml'

# -----------节点处理-----------
rename-node: true
node-prefix: ''
node-type:
  - vless
  - trojan
  - hysteria2
  - hy2
  - vmess
  - ss
drop-bad-cf-nodes: false
enhanced-tag: true

# -----------流媒体与纯净度检测-----------
media-check: true
media-check-timeout: 6
platforms:
  - iprisk
  - youtube
  - x

# -----------存储与回调-----------
output-dir: './output'
save-method: 'local'
callback-script: 'scripts\on_check_done.bat'

# -----------通知设置（已关闭）-----------
recipient-url: []

# -----------国内拉取订阅 GitHub 镜像加速（即使本机没挂代理也能拉取）-----------
github-proxy: ''
ghproxy-group:
  - https://gh-proxy.com/
  - https://ghfast.top/
  - https://hk.gh-proxy.org/
  - https://cdn.gh-proxy.org/
  - https://github.732086.xyz/
  - https://github.180280.xyz/

# -----------订阅拉取参数-----------
sub-urls-retry: 2
sub-urls-timeout: 12
sub-url-max-size-mb: 50
net-guard: true
success-rate: 0

# -----------公益节点订阅源-----------
sub-urls-remote:
  - 'https://raw.githubusercontent.com/sinspired/airport/main/subs/merged/col.txt'
  - 'https://raw.githubusercontent.com/sinspired/airport/main/subs/merged/cm.txt'

